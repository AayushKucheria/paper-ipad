<!doctype html><!-- Interaction design for approved direct implementation. Sample content is labeled. --><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper</title><style>body{margin:0;background:#f4f4f1;color:#242923;font:17px -apple-system,sans-serif}main{max-width:1050px;margin:30px auto}h1,h2{font-family:Georgia;font-weight:400}nav,header{display:flex;align-items:center;gap:12px}button{background:white;border:1px solid #ccd4cb;border-radius:10px;padding:12px 18px;color:#344f3d;font:inherit;cursor:pointer}button.active{background:#344f3d;color:white}article{background:white;padding:25px;border-radius:12px;margin:16px 0}small{color:#687367}textarea{display:block;box-sizing:border-box;width:100%;min-height:80px;margin:12px 0;border:1px solid #d0d6cd;border-radius:8px;padding:12px;font:inherit}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.page{min-height:500px;padding:45px;font-family:Georgia;line-height:1.7}.ink{font:italic 26px cursive;color:#24537b}label{display:block;padding:10px}</style><main><h1>Paper</h1><nav><button class="active" onclick="switchTab(this,'Downloaded')">Downloaded</button><button onclick="switchTab(this,'Library')">Library</button><button onclick="switchTab(this,'Articles')">Articles</button><button onclick="switchTab(this,'Markups')">Markups</button></nav><h2 id="title">Downloaded</h2><article><small>Interaction sample · not your library</small><h2>A page for your thoughts</h2><p>Read and write with your Pencil.</p><button onclick="this.nextElementSibling.hidden=false">Open reading copy</button><p hidden>Native PDF reading opens here in the app.</p></article><article><h2>Backup</h2><p>Choose a folder in Files to keep dated copies of your PDFs and notes.</p><button onclick="this.innerText='Folder picker opens in the app'">Choose backup folder</button></article><script>function switchTab(b,t){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('title').innerText=t}</script></main>
